[tool.ruff]
target-version = "py310"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["config", "db", "errors", "models", "routers", "services"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["^scripts/"]
